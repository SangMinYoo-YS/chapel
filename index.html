<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="어디서든 함께 앉아 예배드리는 3D 온라인 예배당">
<meta name="theme-color" content="#17130f">
<meta property="og:title" content="랜선 예배당">
<meta property="og:description" content="어디서든 함께 앉아 예배드리는 3D 온라인 예배당">
<title>랜선 예배당</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: a 3D nave fills the top (walk, sit, pray together), then live-service card, prayer board, admin. Evening chapel, deliberately dark. */
:root{
  --night:#17130f;
  --ink:#f3ebdd;
  --muted:#ab9d89;
  --candle:#f0c06a;
  --ruby:#b2394f;
  --sapphire:#3c6fae;
  --emerald:#3f8a6a;
  --line:rgba(243,235,221,.12);
  --glass:rgba(23,19,15,.62);
  --display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.55rem}
h2{font-size:1.2rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--candle);text-transform:uppercase}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.count{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.flame{width:9px;height:13px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3cf,var(--candle) 55%,#c46a2a);box-shadow:0 0 10px var(--candle);animation:flick 2.4s ease-in-out infinite}
@keyframes flick{50%{transform:scaleY(.86) translateY(1px);opacity:.85}}

/* ---------- 3D stage ---------- */
.stage{position:relative;height:clamp(400px,70vh,640px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#120e0b;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;right:10px;display:flex;gap:8px;pointer-events:none}
.hud.top{top:10px;justify-content:space-between;align-items:flex-start}
.hud.bottom{bottom:12px;left:auto;right:10px;flex-direction:column;align-items:stretch;width:112px}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:64%}
.hud-r .hint{max-width:100%}
.hud-r button.chip{cursor:pointer}
.hud-r button.chip[aria-pressed="true"]{border-color:var(--candle);color:var(--candle)}
.joy{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle,rgba(243,235,221,.10),rgba(243,235,221,.04) 70%);border:1px solid rgba(243,235,221,.22);touch-action:none;z-index:2}
.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(240,192,106,.85);box-shadow:0 0 18px rgba(240,192,106,.5);transition:transform .12s}
.joy.active .knob{transition:none}
@media (hover:hover) and (pointer:fine){.joy{opacity:.55}}
.chip{pointer-events:auto;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.8rem;color:var(--ink)}
.hint{border-radius:12px;font-size:.76rem;line-height:1.45;color:var(--muted)}
.ctl{pointer-events:auto;flex:0 1 auto;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;font-weight:500;font-size:.9rem}
.ctl[aria-pressed="true"]{border-color:var(--candle);color:var(--candle);background:rgba(60,44,24,.75)}
.ctl.amen{background:var(--candle);color:var(--night);border-color:var(--candle);font-family:var(--display);font-weight:700}
.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--display);color:var(--muted);background:#120e0b;transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

/* ---------- live ---------- */
.live-card{display:grid;gap:14px;padding:18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(60,111,174,.10),rgba(178,57,79,.06))}
.status{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.status strong{font-family:var(--display);font-size:1.25rem}
.pill{font-size:.72rem;font-weight:600;letter-spacing:.08em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.on{background:var(--ruby);border-color:var(--ruby);color:#fff}
.go{display:inline-flex;justify-content:center;align-items:center;padding:13px 18px;border-radius:10px;background:var(--ruby);color:#fff;text-decoration:none;font-weight:600}
.go[aria-disabled="true"]{background:rgba(243,235,221,.08);color:var(--muted);pointer-events:none}
.note{font-size:.82rem;color:var(--muted);margin:0}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.sched li{display:grid;grid-template-columns:44px 56px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.sched li.now{color:var(--candle)}
.sched .d{color:var(--muted)}

/* ---------- prayers ---------- */
.board{display:grid;gap:14px}
form.ask{display:grid;gap:8px}
textarea,input[type=url]{width:100%;background:rgba(243,235,221,.05);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.btn{padding:9px 16px;border-radius:9px;border:0;background:var(--candle);color:var(--night);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.prayer{padding:14px 14px 10px;border-radius:12px;background:rgba(243,235,221,.04);border:1px solid var(--line);display:grid;gap:8px;min-width:0}
.prayer p{margin:0;font-family:var(--display);font-size:1rem;line-height:1.65;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.with{border:1px solid var(--line);background:none;border-radius:99px;padding:3px 11px;cursor:pointer;font-size:.8rem;color:var(--ink)}
.with[aria-pressed="true"]{border-color:var(--candle);color:var(--candle)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.78rem;text-decoration:underline}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);font-size:.9rem}
details.admin{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.admin summary{cursor:pointer;font-weight:600}
.admin form{display:grid;gap:12px;margin-top:12px}
.admin label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.saved{font-size:.82rem;color:var(--emerald)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.ctl{padding:9px 11px;font-size:.84rem}.hud.bottom{width:96px}}
.enter{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,rgba(240,192,106,.16),rgba(13,10,16,.88) 60%);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.enter[hidden]{display:none}
.enter h2{font-size:1.6rem}
.enter p{margin:0;color:var(--muted);font-size:.9rem}
.enter input{width:min(260px,100%);text-align:center;background:rgba(243,235,221,.07);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}
.enter .btn{padding:13px 28px;font-size:1rem;font-family:var(--display)}
.demo{font-size:.78rem;color:var(--candle)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Online Sanctuary</div>
      <h1 id="church">랜선 예배당</h1>
    </div>
    <div class="count"><span class="flame" aria-hidden="true"></span><span id="count">지금 1명이 함께 예배 중</span></div>
  </header>

  <section class="stage" id="stage" aria-label="3D 예배당">
    <div class="loading" id="loading"><span class="flame" aria-hidden="true"></span>예배당 문을 여는 중</div>
    <form class="enter" id="enter" hidden>
      <span class="flame" aria-hidden="true"></span>
      <h2 id="enter-title">랜선 예배당</h2>
      <p id="enter-sub">지금 <b id="enter-count">0</b>명이 앉아 예배드리고 있어요</p>
      <input id="nick" maxlength="12" placeholder="이름 (비워 두면 '성도')" autocomplete="nickname">
      <button class="btn" type="submit">예배당 들어가기</button>
      <span class="demo" id="demo" hidden>체험 모드: 아직 서버가 연결되지 않아 혼자 둘러봐요</span>
    </form>
    <div class="hud top">
      <span class="chip" id="where">입구에 서 있어요</span>
      <span class="hud-r"><button class="chip" id="b-organ" aria-pressed="false">오르간 켜기</button>
      <span class="chip hint" id="hint">바닥을 누르거나 왼쪽 조이스틱으로 걸어요. 장의자를 누르면 앉아요</span></span>
    </div>
    <div class="joy" id="joy" aria-label="이동 조이스틱"><div class="knob" id="knob"></div></div>
    <div class="toast" id="toast"></div>
    <div class="hud bottom">
      <button class="ctl" id="b-pray" aria-pressed="false">기도</button>
      <button class="ctl" id="b-praise" aria-pressed="false">찬양</button>
      <button class="ctl amen" id="b-amen">아멘</button>
      <button class="ctl" id="b-view" hidden>스크린 보기</button>
      <button class="ctl" id="b-stand" hidden>일어서기</button>
    </div>
  </section>

  <section class="live-card" aria-labelledby="live-h">
    <div class="eyebrow" id="live-h">실시간 예배</div>
    <div class="status"><span class="pill" id="pill">대기</span><strong id="statusText">다음 예배를 기다리는 중</strong></div>
    <a class="go" id="go" target="_blank" rel="noopener" aria-disabled="true">예배 영상 링크 준비 중</a>
    <p class="note" id="golink"></p>
    <ul class="sched" id="sched"></ul>
  </section>

  <section class="board" aria-labelledby="pr-h">
    <div>
      <div class="eyebrow">Prayer Requests</div>
      <h2 id="pr-h">기도제목 나눔</h2>
    </div>
    <form class="ask" id="ask">
      <textarea id="ask-text" rows="3" maxlength="200" placeholder="함께 기도받고 싶은 제목을 적어 주세요 (200자)"></textarea>
      <div class="row2">
        <label class="check"><input type="checkbox" id="ask-anon" checked> 익명으로 올리기</label>
        <button class="btn" id="ask-btn" type="submit">기도제목 올리기</button>
      </div>
      <p class="note" id="ask-note" hidden></p>
    </form>
    <ul class="list" id="prayers"></ul>
  </section>

</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(() => {
const DAYS=["일","월","화","수","목","금","토"];
const DEFAULT={streamUrl:"",
  slides:["랜선 예배당에 오신 것을 환영합니다\n— 어디서든 함께 드리는 예배",
    "여호와는 나의 목자시니\n내가 부족함이 없으리로다\n— 시편 23:1",
    "수고하고 무거운 짐 진 자들아\n다 내게로 오라\n내가 너희를 쉬게 하리라\n— 마태복음 11:28",
    "두세 사람이 내 이름으로 모인 곳에는\n나도 그들 중에 있느니라\n— 마태복음 18:20"],
  schedule:[{day:0,time:"09:00",name:"주일 1부 예배",dur:70},{day:0,time:"11:00",name:"주일 2부 예배",dur:90},
    {day:3,time:"19:30",name:"수요 예배",dur:70},{day:5,time:"21:00",name:"금요 기도회",dur:90}]};
const CFG=window.CHAPEL||{};
const S={config:{streamUrl:CFG.streamUrl||"",slides:Array.isArray(CFG.slides)&&CFG.slides.length?CFG.slides:DEFAULT.slides,schedule:Array.isArray(CFG.schedule)&&CFG.schedule.length?CFG.schedule:DEFAULT.schedule},nick:"",entered:false,room:null,peers:[],myPeer:null,myId:null,canEdit:false,canWrite:null,db:null,user:null,profiles:{},prayers:null};
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let toastT; function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),2200);}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}

/* ================= schedule (KST) ================= */
function kstNow(){const d=new Date(Date.now()+9*3600e3);return{day:d.getUTCDay(),min:d.getUTCHours()*60+d.getUTCMinutes()}}
function toMin(t){const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?+m[1]*60+ +m[2]:null}
function liveState(){const n=kstNow(),w=n.day*1440+n.min;let live=null,next=null,nextIn=Infinity;
  for(const s of S.config.schedule||[]){const m=toMin(s.time);if(m===null)continue;const st=s.day*1440+m,dur=+s.dur||60;
    let d=w-st;if(d<0)d+=10080;if(d<dur)live=s;let u=st-w;if(u<=0)u+=10080;if(u<nextIn){nextIn=u;next=s}}
  return{live,next,nextIn}}
function fmtIn(m){const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;return d?d+"일 "+h+"시간 후":h?h+"시간 "+mm+"분 후":mm+"분 후"}
function validUrl(u){try{const x=new URL(u);return x.protocol==="https:"?x.href:null}catch{return null}}
let wasLive=null;
function renderLive(){
  const{live,next,nextIn}=liveState(),pill=$("pill"),go=$("go"),url=validUrl(S.config.streamUrl);
  if(live){pill.textContent="LIVE";pill.classList.add("on");$("statusText").textContent=live.name+" 진행 중"}
  else{pill.textContent="대기";pill.classList.remove("on");$("statusText").textContent=next?next.name+" · "+fmtIn(nextIn):"예배 시간이 아직 등록되지 않았어요"}
  if(url){go.href=url;go.setAttribute("aria-disabled","false");go.textContent=live?"지금 실시간 예배 보기 ↗":"예배 채널 열기 ↗";$("golink").textContent="유튜브가 새 창에서 열려요. 예배당 화면은 켜 둔 채로 함께 앉아 계세요."}
  else{go.removeAttribute("href");go.setAttribute("aria-disabled","true");go.textContent="예배 영상 링크 준비 중";$("golink").textContent="관리자가 유튜브 라이브 주소를 등록하면 여기서 바로 들어갈 수 있어요."}
  const ul=$("sched");ul.textContent="";
  [...(S.config.schedule||[])].sort((a,b)=>a.day-b.day||toMin(a.time)-toMin(b.time)).forEach(s=>{
    const li=document.createElement("li");if(live===s)li.className="now";
    for(const t of[(DAYS[s.day]||"?")+"요일",s.time,s.name]){const sp=document.createElement("span");sp.textContent=t;li.appendChild(sp)}
    li.firstChild.className="d";ul.appendChild(li)});
  if(!!live!==wasLive){wasLive=!!live;drawScreen()}
}
setInterval(renderLive,30000);

/* ================= 3D ================= */
const stage=$("stage");
let drawScreen=()=>{};
const W={ready:false};
if(!window.THREE){ $("loading").textContent="3D 화면을 불러오지 못했어요. 새로고침해 주세요."; }
else try{ init3D(); }catch(e){ console.error(e); $("loading").textContent="이 기기에서는 3D 화면을 열 수 없어요."; }

function init3D(){
  const T=THREE;
  const renderer=new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.outputEncoding=T.sRGBEncoding;
  renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
  renderer.shadowMap.enabled=false;
  stage.prepend(renderer.domElement);
  const scene=new T.Scene();
  scene.background=new T.Color(0x0d0a10);
  scene.fog=new T.Fog(0x110d14,18,44);
  const camera=new T.PerspectiveCamera(55,1,0.1,100);

  // ---- textures
  function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=4;return t}
  const floorTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle="#4a3424";g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32){for(let x=(y/32%2)*64;x<w+128;x+=128){const v=hash(x+":"+y)%30-15;g.fillStyle=`rgb(${78+v},${55+v*.7},${38+v*.5})`;g.fillRect(x,y,126,30)}}
    g.globalAlpha=.08;for(let i=0;i<900;i++){g.fillStyle=i%2?"#000":"#fff";g.fillRect(Math.random()*w,Math.random()*h,8+Math.random()*30,1)}});
  floorTex.wrapS=floorTex.wrapT=T.RepeatWrapping;floorTex.repeat.set(4,7);
  const glassTex=(seed)=>canvasTex(128,256,(g,w,h)=>{const pal=["#3c6fae","#b2394f","#f0c06a","#3f8a6a","#6b4fa0","#2e5a8f"];
    g.fillStyle="#120c08";g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32)for(let x=0;x<w;x+=32){g.fillStyle=pal[(hash(seed+x+","+y))%pal.length];g.fillRect(x+3,y+3,26,26)}
    g.fillStyle="rgba(255,240,200,.85)";g.fillRect(w/2-6,40,12,120);g.fillRect(w/2-30,72,60,12);
    g.globalCompositeOperation="destination-in";g.beginPath();g.moveTo(0,h);g.lineTo(0,w/2);g.arc(w/2,w/2,w/2,Math.PI,0);g.lineTo(w,h);g.closePath();g.fill()});
  const glowTex=(col)=>{const t=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,4,64,64,64);r.addColorStop(0,col);r.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=r;g.fillRect(0,0,w,h)});return t};

  // ---- room 15 x 28, side walls 7m, barrel vault above
  const ROOM={x:7.5,zMin:-15,zMax:13,h:7};

/* ================= organ (generated, gentle hymn chords) ================= */
let AC=null,organ=null;
function startOrgan(){
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
  const master=AC.createGain();master.gain.value=0;
  const conv=AC.createConvolver(),len=AC.sampleRate*4,buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}conv.buffer=buf;

  const wet=AC.createGain();wet.gain.value=.65;const dry=AC.createGain();dry.gain.value=.35;
  lp.connect(dry);lp.connect(conv);conv.connect(wet);dry.connect(master);wet.connect(master);master.connect(AC.destination);
  master.gain.linearRampToValueAtTime(.15,AC.currentTime+3);
  const chords=[[48,55,64,72],[53,57,65,72],[55,59,67,74],[48,55,64,72],[45,52,60,69],[53,60,65,69],[55,62,67,71],[48,55,64,72]];
  let i=0,next=AC.currentTime+.1;const DUR=4.6;
  function play(notes,t,d){for(const n of notes){const f=440*Math.pow(2,(n-69)/12);
    for(const[type,mul,g]of[["sine",1,.22],["triangle",2,.05],["sine",.5,.1]]){const o=AC.createOscillator();o.type=type;o.frequency.value=f*mul;o.detune.value=(Math.random()-.5)*7;
      const ga=AC.createGain();ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(g,t+.9);ga.gain.setValueAtTime(g,t+d-.5);ga.gain.linearRampToValueAtTime(0,t+d+.5);
      o.connect(ga);ga.connect(lp);o.start(t);o.stop(t+d+.6)}}}
  function sched(){while(next<AC.currentTime+1.2){play(chords[i%chords.length],next,DUR);next+=DUR;i++}}
  sched();organ={master,timer:setInterval(sched,300)};
}
function stopOrgan(){if(!organ)return;const{master,timer}=organ;organ=null;clearInterval(timer);const t=AC.currentTime;
  master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+1.5);setTimeout(()=>master.disconnect(),1800)}
$("b-organ").onclick=()=>{const on=!organ;try{on?startOrgan():stopOrgan()}catch{toast("이 기기에서는 소리를 낼 수 없어요");return}
  $("b-organ").setAttribute("aria-pressed",on);$("b-organ").textContent=on?"오르간 끄기":"오르간 켜기"};

function renderPrayers(){const ul=$("prayers");ul.textContent="";

    who.textContent=(typeof v.name==="string"&&v.name?v.name:"익명")+" · "+(typeof v.createdAt==="number"?ago(v.createdAt):"");meta.appendChild(who);
    const right=document.createElement("span");right.style.cssText="display:flex;gap:10px;align-items:center";
    if(v.uid&&v.uid===S.myId){const del=document.createElement("button");del.className="del";del.type="button";del.textContent="지우기";
      del.onclick=()=>{if(del.dataset.armed){S.fdb.ref("prayers/"+d.id).remove().catch(()=>{})}else{del.dataset.armed="1";del.textContent="정말 지울까요?";setTimeout(()=>{del.dataset.armed="";del.textContent="지우기"},3000)}};right.appendChild(del)}
    const w=document.createElement("button");w.type="button";w.className="with";const done=mine.includes(d.id);w.setAttribute("aria-pressed",done);
    w.textContent=(done?"함께 기도했어요 ":"함께 기도하기 ")+(+v.count||0);w.disabled=done;
    w.onclick=()=>{const m=store.get("prayed",[]);if(m.includes(d.id))return;m.push(d.id);store.set("prayed",m);
      S.fdb.ref("prayers/"+d.id+"/count").transaction(c=>(typeof c==="number"?c:0)+1).catch(()=>{});renderPrayers()};
    right.appendChild(w);meta.appendChild(right);li.appendChild(meta);ul.appendChild(li)}}
function note(t){const n=$("ask-note");n.hidden=false;n.textContent=t}
let lastAsk=0;
$("ask").addEventListener("submit",async e=>{e.preventDefault();const t=$("ask-text").value.trim();if(!t)return;
  if(!S.fdb){note("서버가 연결되면 기도제목을 올릴 수 있어요.");return}
  if(Date.now()-lastAsk<60000){note("잠시 후에 다시 올려 주세요. (1분에 한 번)");return}
  const anon=$("ask-anon").checked;$("ask-btn").disabled=true;
  try{await S.fdb.ref("prayers").push({text:t.slice(0,200),name:anon?"익명":(S.nick||"성도"),uid:S.myId,createdAt:firebase.database.ServerValue.TIMESTAMP,count:0});
    lastAsk=Date.now();$("ask-text").value="";note("올렸어요. 함께 기도할게요.")}
  catch{note("올리지 못했어요. 잠시 후 다시 시도해 주세요.")}$("ask-btn").disabled=false});

/* ================= realtime (Firebase) ================= */
function setCount(){const n=Math.max(S.entered?1:0,S.peers.length);$("count").textContent="지금 "+Math.max(1,n)+"명이 함께 예배 중";$("enter-count").textContent=S.peers.length}
async function connect(){
  const fb=CFG.firebase;
  if(!window.firebase||!fb||!fb.apiKey||!fb.databaseURL){$("demo").hidden=false;$("enter-sub").textContent="말없이 같이 앉아 예배드리는 곳";renderPrayers();return}
  try{
    firebase.initializeApp(fb);
    const cred=await firebase.auth().signInAnonymously();S.myId=cred.user.uid;S.myPeer=S.myId;
    const db=firebase.database();S.fdb=db;
    let skew=0;db.ref(".info/serverTimeOffset").on("value",s=>{skew=s.val()||0});
    // everyone in the room
    const raw=new Map(),pref=db.ref("presence");
    const rebuild=()=>{const now=Date.now()+skew;S.peers=[...raw].filter(([k,p])=>p&&typeof p.t==="number"&&now-p.t<75000&&typeof p.x==="number")
      .map(([k,p])=>({peer:k,sameTab:k===S.myId,kind:"viewer",presence:p}));setCount();W.syncPeers&&W.syncPeers()};
    pref.on("child_added",c=>{raw.set(c.key,c.val());rebuild()});
    pref.on("child_changed",c=>{raw.set(c.key,c.val());rebuild()});
    pref.on("child_removed",c=>{raw.delete(c.key);rebuild()});
    setInterval(rebuild,15000);
    // my presence
    const mine=db.ref("presence/"+S.myId);let cur={};
    S.room={presence(patch){if(!S.entered)return Promise.resolve();Object.assign(cur,patch);
      return mine.set({...cur,name:S.nick||"",t:firebase.database.ServerValue.TIMESTAMP})}};
    db.ref(".info/connected").on("value",s=>{if(s.val()){mine.onDisconnect().remove();if(S.entered)W.onConnected&&W.onConnected()}});
    setInterval(()=>{if(S.entered)mine.update({t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{})},25000);
    // prayers
    S.prayers=null;renderPrayers();
    db.ref("prayers").orderByChild("createdAt").limitToLast(40).on("value",snap=>{const arr=[];snap.forEach(c=>{arr.push({id:c.key,v:c.val()})});arr.reverse();S.prayers=arr;renderPrayers()},
      ()=>{S.prayers=[];renderPrayers()});
  }catch(err){console.error(err);$("demo").hidden=false;$("demo").textContent="서버에 연결하지 못했어요. 혼자 둘러보는 중이에요.";renderPrayers()}
}

/* ================= boot ================= */
if(CFG.churchName){$("church").textContent=CFG.churchName;$("enter-title").textContent=CFG.churchName;document.title=CFG.churchName}
$("nick").value=store.get("nick","");
$("enter").addEventListener("submit",e=>{e.preventDefault();S.nick=$("nick").value.trim().slice(0,12);store.set("nick",S.nick);
  S.entered=true;$("enter").hidden=true;setCount();W.onConnected&&W.onConnected()});
renderLive();renderPrayers();connect();
})();
</script>
